services:
  crawler:
    image: rxyoungyang/crawler:latest
    container_name: crawler
    env_file:
      - .env
    environment:
      # 未在 .env 中设置时兜底，多站点并发（yfbzb + ceb）
      - SITES=${SITES:-yfbzb,ceb}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./file:/app/file
      - ./logs:/app/logs
      # 崩溃续跑 checkpoint（按需挂载）
      # - ./state-yfbzb.json:/app/state-yfbzb.json
      # - ./state-ceb.json:/app/state-ceb.json
      # - ./state-site2.json:/app/state-site2.json
    restart: unless-stopped

    # 1C1G / 低配机优化（参考 rust-migration）
    mem_limit: 300m
    mem_reservation: 150m
    cpus: '0.8'

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
