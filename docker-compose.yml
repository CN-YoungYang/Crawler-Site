services:
  # 代理 sidecar：easy_proxies 为 CEB 提供 multi-port 独立节点入口。
  # 首次使用：cp easy_proxies/config.yaml.example easy_proxies/config.yaml，再填写 subscriptions。
  # crawler 通过 easy_proxies:9091 获取健康节点；CEB 默认从 24000 端口开始。
  easy_proxies:
    image: ghcr.io/jasonwong1991/easy_proxies:latest
    container_name: easy_proxies
    volumes:
      - ./easy_proxies:/etc/easy_proxies
    expose:
      - "9091"
      - "24000-24200"
    # 如需从宿主机访问管理面板/独立代理端口，再取消下面注释；默认只在 Compose 网络内开放。
    # ports:
    #   - "9091:9091"
    #   - "24000-24200:24000-24200"
    restart: unless-stopped

  crawler:
    image: rxyoungyang/crawler:latest
    container_name: crawler
    env_file:
      - .env
    environment:
      # 未在 .env 中设置时兜底，多站点并发（yfbzb 湖北乙方宝 + ceb 中国招标公共服务平台湖北）
      - SITES=${SITES:-yfbzb,ceb}
      - TZ=${TZ:-Asia/Shanghai}
      - HTTP_PORT=${HTTP_PORT:-8080}
      - HTTP_ENABLED=${HTTP_ENABLED:-true}
      # 代理：CEB 默认使用 easy_proxies 的第一个 multi-port 节点；切点时由 crawler 动态改端口。
      # - 全站：HTTP_PROXY=http://easy_proxies:24000（不建议，yfbzb 通常应直连）
      # - 单站：CEB_PROXY_URL=http://easy_proxies:24000 / PROXY_CEB=http://easy_proxies:24000
      # - 白名单：NO_PROXY=localhost,127.0.0.1,yfbzb.com
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - PROXY_CEB=${PROXY_CEB:-}
      - CEB_PROXY_URL=${CEB_PROXY_URL:-http://easy_proxies:24000}
      - EASY_PROXIES_CONTROLLER=${EASY_PROXIES_CONTROLLER:-http://easy_proxies:9091}
      - EASY_PROXIES_PASSWORD=${EASY_PROXIES_PASSWORD:-}
      - EASY_PROXIES_REFRESH_COOLDOWN=${EASY_PROXIES_REFRESH_COOLDOWN:-}
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    volumes:
      - ./file:/app/file
      - ./logs:/app/logs
      # 崩溃续跑 checkpoint（按需挂载）
      # - ./state-yfbzb.json:/app/state-yfbzb.json
      # - ./state-ceb.json:/app/state-ceb.json
    depends_on:
      easy_proxies:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:'+(process.env.HTTP_PORT||8080)+'/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # 轻量镜像（已移除 chromium），资源按需回调
    mem_limit: 400m
    mem_reservation: 150m
    cpus: '0.5'

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
